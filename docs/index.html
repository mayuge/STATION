<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>map template</title>

  <link
    href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css"
    rel="stylesheet"
  />

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    #map {
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <script src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script>

  <script>
    const map = new maplibregl.Map({
      container: "map",

      style:
        "https://raw.githubusercontent.com/mayuge/OpenSourceStyle/refs/heads/main/style.json",

      center: [137.0, 38.5],
      zoom: 5
    });

    // ズーム・回転コントロール
    map.addControl(
      new maplibregl.NavigationControl(),
      "top-right"
    );
  </script>
</body>
</html>
